[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "perf"
version = "0.1.0"
description = "Mesure et attribution de performance : Brinson-Fachler mensuel, quatre chaînages multi-périodes (Cariño, Menchero, GRAP, Frongello) réconciliés à 1e-12, TWR/MWR/Dietz modifié validés sur les exemples chiffrés du GIPS Handbook 2020."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "typer>=0.12",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
perf = "perf.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/14-attribution-performance"

[tool.hatch.build.targets.wheel]
packages = ["src/perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
